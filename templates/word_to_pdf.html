<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word para PDF</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5277367888683216" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicion.svg')}}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <a href="/" class="back-button">← Voltar</a>

        <h1>Word para PDF</h1>

        <p>Converta arquivos DOCX para PDF rapidamente</p>

        <form action="/word-to-pdf-page"
              method="POST"
              enctype="multipart/form-data"
              id="uploadForm">

            <div class="drop-zone" id="dropZone">

                <input type="file"
                       id="fileInput"
                       name="document"
                       accept=".doc,.docx,.odt"
                       hidden>

                <p>Arraste o arquivo Word aqui</p>
                <span>ou clique para selecionar</span>

            </div>

            <div id="fileList"></div>

            <div class="loading-box" id="loadingBox">
                <div class="spinner"></div>
                <p id="statusText">Convertendo arquivo...</p>
                <div class="progress-container" style="width: 100%; background: #1e293b; border-radius: 10px; height: 10px; margin-top: 10px;">
                    <div id="progressBar" style="width: 0%; background: #2563eb; height: 100%; border-radius: 10px; transition: width 0.3s;"></div>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                Converter para PDF
            </button>

        </form>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
