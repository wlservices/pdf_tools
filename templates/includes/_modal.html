<div id="meu-modal" class="modal">
  <div class="modal-conteudo">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <p class="menssage">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <!-- Botão limpa a URL e fecha o modal -->
    <a href="/contact" class="btn-ok" id="btnCloseModal">X</a>
  </div>
</div>
