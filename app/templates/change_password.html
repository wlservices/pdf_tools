<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Senha - WL Converter Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5277367888683216" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.ico')}}" type="image/x-icon">
</head>
<body>
    <nav class="navbar">
        <div class="logo">WL Converter Admin</div>
        <div class="nav-links">
            <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('admin_logout') }}" style="color: #ef4444;">Sair</a>
        </div>
    </nav>

    <div class="change-password-container">
        <h2>Alterar Senha</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash-messages">
              {% for message in messages %}
                <div class="{{ 'success' if 'sucesso' in message.lower() else 'error' }}">
                    {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Senha Atual</label>
                <input type="password" name="current_password" required>
            </div>
            <div class="form-group">
                <label>Nova Senha</label>
                <input type="password" name="new_password" required>
            </div>
            <div class="form-group">
                <label>Confirmar Nova Senha</label>
                <input type="password" name="confirm_password" required>
            </div>
            
            <div class="btn-group">
                <a href="{{ url_for('admin_dashboard') }}" class="cancel-btn">Cancelar</a>
                <button type="submit" class="submit-btn">Atualizar Senha</button>
            </div>
        </form>
    </div>
</body>
</html>
